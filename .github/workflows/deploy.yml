name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize deploys: CloudFormation rejects a change set while the stack is
# UPDATE_IN_PROGRESS, which silently drops the later of two close merges.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TM_LABS_WILDCARD_CERT_ARN: ${{ secrets.TM_LABS_WILDCARD_CERT_ARN }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      WALKSCORE_API_KEY: ${{ secrets.WALKSCORE_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-tags: true
      - name: Set up Python via mise
        uses: jdx/mise-action@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Generate AWS profile
        run: |
          mkdir ~/.aws
          cat >> ~/.aws/credentials << EOF
          [transitmatters]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EOF
      - name: Run deploy shell script
        run: bash deploy/deploy.sh
