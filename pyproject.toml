[project]
name = "walkscore-proxy"
version = "1.0.0"
description = "Proxy calls to Walkscore® API to hide API key and cache results"
authors = [{ name = "TransitMatters Labs Team" }]
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "requests==2.32.5",
    "boto3>=1.43.70,<1.44.0",
    "datadog_lambda>=8.129.0,<8.130",
]

[dependency-groups]
dev = [
    "chalice==1.33.0",
    "ruff>=0.16.2",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
